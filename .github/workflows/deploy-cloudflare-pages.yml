name: Deploy to Cloudflare Pages

# 推送到 main 自动部署；也可以在 Actions 页面手动触发。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# 同一分支同时只跑一个部署，新的推送取消上一次未完成的运行
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest

    env:
      # Cloudflare Pages 项目名（全局唯一，原作者已占用 word-wind）
      # 默认值来自仓库变量 CLOUDFLARE_PAGES_PROJECT，未设置时用 word-wind-study
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'word-wind-study' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 凭据没配好就立刻失败，并写清楚缺什么，省掉白跑的构建时间
      - name: Check Cloudflare credentials
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            {
              echo "### ⚠️ 部署未执行：缺少仓库 Secret"
              echo ""
              echo "缺少：\`$missing\`"
              echo ""
              echo "按 \`DEPLOY.md\` 第二节配置后，在本页点 **Re-run all jobs** 即可。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::缺少仓库 Secret：$missing（配置方法见 DEPLOY.md）"
            exit 1
          fi
          echo "✅ 凭据已配置，目标项目：$PAGES_PROJECT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
        # 这些是构建期变量（Vite 会内联进产物），不填就是默认行为：
        # 词库走原作者的公开只读实例、反馈表单关闭、不加载统计脚本。
        # 要覆盖就在仓库 Settings → Secrets and variables → Actions → Variables 里建同名变量。
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_FEEDBACK_ENABLED: ${{ vars.VITE_FEEDBACK_ENABLED }}
          VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}

      # 先查项目是否存在，不在才创建，避免每跑一次都留一条 warning
      - name: Ensure Pages project exists
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api")

          if [ "$code" = "200" ]; then
            echo "✅ 项目 $PAGES_PROJECT 已存在"
            exit 0
          fi

          echo "项目 $PAGES_PROJECT 不存在（HTTP $code），尝试创建……"
          if npx --yes wrangler@3 pages project create "$PAGES_PROJECT" --production-branch=main; then
            echo "✅ 已创建项目 $PAGES_PROJECT"
            exit 0
          fi

          {
            echo "### ❌ 无法创建 Cloudflare Pages 项目"
            echo ""
            echo "项目 \`$PAGES_PROJECT\` 不存在，且创建被拒绝。"
            echo ""
            echo "常见原因：**CLOUDFLARE_API_TOKEN 权限不足**。"
            echo "该 Token 需要具备 **Account → Cloudflare Pages → Edit** 权限（配置方法见 \`DEPLOY.md\`）。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::项目 $PAGES_PROJECT 不存在且创建被拒绝，请确认 CLOUDFLARE_API_TOKEN 具备 Account → Cloudflare Pages → Edit 权限"
          exit 1

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy dist --project-name="$PAGES_PROJECT" --branch="${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cloudflare Pages"
            echo ""
            echo "- 项目：\`${PAGES_PROJECT}\`"
            echo "- 生产地址：https://${PAGES_PROJECT}.pages.dev"
            echo "- 分支：\`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
